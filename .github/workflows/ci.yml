name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn
      - run: yarn install --immutable
      # lint, build (emscripten runs via docker, which the runner provides) and test
      - run: yarn ci
